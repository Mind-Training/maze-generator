[tool.poetry]
name = "mazegen"
version = "0.1.0"
description = "Python library for generating Maze game boards"
authors = ["MazeGen Maintainers <maintainers@example.com>"]
readme = "README.md"
packages = [{ include = "mazegen" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
